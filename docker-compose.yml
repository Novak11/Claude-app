version: '3.8'

services:
  frontend:
    build:
      context: ./frontend-service
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - API_URL=http://api:8000
      - PORT=5000
    depends_on:
      - api
    networks:
      - app-network

  api:
    build:
      context: ./api-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GENERATOR_URL=http://generator:8001
    depends_on:
      - generator
    networks:
      - app-network

  generator:
    build:
      context: ./generator-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
